<div class="card">
  <h2 id="tituloFormularioEmpleado">Nuevo empleado</h2>

  <input type="hidden" id="empleadoIdEnEdicion" value="">

  <div class="fila-campos">
    <div class="campo">
      <label for="empNombre">Nombre del empleado <span class="req">*</span></label>
      <input type="text" id="empNombre" placeholder="Ej. Carlos Pérez" autocomplete="off" maxlength="80">
    </div>

    <div class="campo">
      <label for="empCorreo">Correo (opcional)</label>
      <input type="email" id="empCorreo" placeholder="Ej. carlos@correo.com" autocomplete="off" inputmode="email">
    </div>
  </div>

  <div class="acciones-form">
    <button class="boton boton-primario" id="btnGuardarEmpleado" onclick="guardarEmpleado_()">
      Guardar empleado
    </button>
    <button class="boton boton-fantasma boton-auto oculto" id="btnCancelarEdicionEmpleado" onclick="cancelarEdicionEmpleado_()">
      Cancelar
    </button>
  </div>
</div>

<div class="card">
  <div class="encabezado-lista">
    <h2>Empleados</h2>
    <label class="check-inline">
      <input type="checkbox" id="checkVerInactivosEmpleados" onchange="cargarEmpleados_()">
      Ver inactivos
    </label>
  </div>
  <div id="tablaEmpleados">
    <p class="texto-vacio">Cargando...</p>
  </div>
</div>

<script>
  var empleadosCache_ = [];

  function cargarEmpleados_() {
    var verInactivos = document.getElementById('checkVerInactivosEmpleados').checked;
    var contenedor = document.getElementById('tablaEmpleados');
    contenedor.innerHTML = '<p class="texto-vacio">Cargando...</p>';

    var llamada = google.script.run
      .withSuccessHandler(function (empleados) {
        empleadosCache_ = empleados || [];
        poblarTablaEmpleados_(empleadosCache_);
      })
      .withFailureHandler(function (error) {
        contenedor.innerHTML = '<p style="font-size:13px; color:var(--color-alerta);">Error al cargar: ' + esc_(error.message) + '</p>';
      });

    if (verInactivos) {
      llamada.apiListarTodosLosEmpleados();
    } else {
      llamada.apiListarEmpleadosActivos();
    }
  }

  function poblarTablaEmpleados_(empleados) {
    var contenedor = document.getElementById('tablaEmpleados');

    if (empleados.length === 0) {
      contenedor.innerHTML = '<p class="texto-vacio">No hay empleados registrados.</p>';
      return;
    }

    var html = '<div class="tabla-scroll"><table><thead><tr><th>Nombre</th><th>Correo</th><th>Estado</th><th></th></tr></thead><tbody>';

    empleados.forEach(function (e) {
      var insigniaEstado = e.activo
        ? '<span class="insignia insignia-exito">Activo</span>'
        : '<span class="insignia insignia-alerta">Inactivo</span>';

      var botonToggle = e.activo
        ? '<button class="boton boton-peligro boton-sm" onclick="confirmarDesactivarEmpleado_(' + e.id_empleado + ')">Desactivar</button>'
        : '<button class="boton boton-secundario boton-sm" onclick="reactivarEmpleado_(' + e.id_empleado + ')">Reactivar</button>';

      html += '<tr>' +
        '<td>' + esc_(e.nombre_empleado) + '</td>' +
        '<td>' + (esc_(e.correo) || '<span style="color:var(--color-base-suave);">—</span>') + '</td>' +
        '<td>' + insigniaEstado + '</td>' +
        '<td><div class="acciones-fila">' +
          '<button class="boton boton-fantasma boton-sm" onclick="editarEmpleadoDesdeTabla_(' + e.id_empleado + ')">Editar</button>' +
          botonToggle +
        '</div></td>' +
        '</tr>';
    });

    html += '</tbody></table></div>';
    contenedor.innerHTML = html;
  }

  function guardarEmpleado_() {
    var idEnEdicion = document.getElementById('empleadoIdEnEdicion').value;

    var datos = {
      nombre_empleado: document.getElementById('empNombre').value.trim(),
      correo: document.getElementById('empCorreo').value.trim()
    };

    if (!datos.nombre_empleado) {
      mostrarMensajeGlobal_('error', 'El nombre del empleado es obligatorio.');
      return;
    }

    if (datos.correo && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(datos.correo)) {
      mostrarMensajeGlobal_('error', 'El correo no tiene un formato válido.');
      return;
    }

    var boton = document.getElementById('btnGuardarEmpleado');
    boton.disabled = true;
    boton.textContent = 'Guardando...';

    var alTerminar = function () {
      boton.disabled = false;
      boton.textContent = 'Guardar empleado';
    };

    if (idEnEdicion) {
      google.script.run
        .withSuccessHandler(function () {
          mostrarMensajeGlobal_('exito', 'Empleado actualizado correctamente.');
          cancelarEdicionEmpleado_();
          cargarEmpleados_();
          alTerminar();
        })
        .withFailureHandler(function (error) {
          mostrarMensajeGlobal_('error', error.message);
          alTerminar();
        })
        .apiEditarEmpleado(Number(idEnEdicion), datos);
    } else {
      google.script.run
        .withSuccessHandler(function () {
          mostrarMensajeGlobal_('exito', 'Empleado creado correctamente.');
          limpiarFormularioEmpleado_();
          cargarEmpleados_();
          alTerminar();
        })
        .withFailureHandler(function (error) {
          mostrarMensajeGlobal_('error', error.message);
          alTerminar();
        })
        .apiCrearEmpleado(datos);
    }
  }

  function editarEmpleadoDesdeTabla_(idEmpleado) {
    var empleado = empleadosCache_.filter(function (e) { return e.id_empleado === idEmpleado; })[0];
    if (!empleado) return;

    document.getElementById('empleadoIdEnEdicion').value = empleado.id_empleado;
    document.getElementById('empNombre').value = empleado.nombre_empleado;
    document.getElementById('empCorreo').value = empleado.correo || '';

    document.getElementById('tituloFormularioEmpleado').textContent = 'Editar empleado';
    document.getElementById('btnCancelarEdicionEmpleado').classList.remove('oculto');

    document.getElementById('empNombre').scrollIntoView({ behavior: 'smooth', block: 'center' });
  }

  function cancelarEdicionEmpleado_() {
    limpiarFormularioEmpleado_();
  }

  function limpiarFormularioEmpleado_() {
    document.getElementById('empleadoIdEnEdicion').value = '';
    document.getElementById('empNombre').value = '';
    document.getElementById('empCorreo').value = '';
    document.getElementById('tituloFormularioEmpleado').textContent = 'Nuevo empleado';
    document.getElementById('btnCancelarEdicionEmpleado').classList.add('oculto');
  }

  function confirmarDesactivarEmpleado_(idEmpleado) {
    var empleado = empleadosCache_.filter(function (e) { return e.id_empleado === idEmpleado; })[0];
    var nombre = empleado ? empleado.nombre_empleado : 'este empleado';

    if (!window.confirm('¿Desactivar a "' + nombre + '"? Solo es posible si no tiene stock pendiente asignado.')) {
      return;
    }

    google.script.run
      .withSuccessHandler(function () {
        mostrarMensajeGlobal_('exito', 'Empleado desactivado.');
        cargarEmpleados_();
      })
      .withFailureHandler(function (error) {
        mostrarMensajeGlobal_('error', error.message);
      })
      .apiDesactivarEmpleado(idEmpleado);
  }

  function reactivarEmpleado_(idEmpleado) {
    google.script.run
      .withSuccessHandler(function () {
        mostrarMensajeGlobal_('exito', 'Empleado reactivado.');
        cargarEmpleados_();
      })
      .withFailureHandler(function (error) {
        mostrarMensajeGlobal_('error', error.message);
      })
      .apiReactivarEmpleado(idEmpleado);
  }
</script>
