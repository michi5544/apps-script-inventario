<script>
  /* Tema claro / oscuro de todo el sistema.
     Se guarda en el navegador y, si nunca se eligió, sigue el del dispositivo.
     Se aplica aquí, antes de pintar la página, para evitar el parpadeo. */
  (function () {
    var CLAVE = 'tema';

    function leer() {
      try {
        var t = localStorage.getItem(CLAVE);
        return (t === 'oscuro' || t === 'claro') ? t : null;
      } catch (e) { return null; }
    }
    function sistema() {
      return (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) ? 'oscuro' : 'claro';
    }
    function pintarBotones() {
      var oscuro = document.documentElement.getAttribute('data-tema') === 'oscuro';
      var botones = document.querySelectorAll('[data-tema-boton]');
      for (var i = 0; i < botones.length; i++) {
        botones[i].textContent = oscuro ? '\u2600' : '\u263E';
        botones[i].setAttribute('title', oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
        botones[i].setAttribute('aria-label', oscuro ? 'Cambiar a tema claro' : 'Cambiar a tema oscuro');
      }
    }
    function aplicar(tema) {
      document.documentElement.setAttribute('data-tema', tema);
      pintarBotones();
      try { window.dispatchEvent(new Event('temacambiado')); } catch (e) {}
    }

    window.alternarTema = function () {
      var nuevo = document.documentElement.getAttribute('data-tema') === 'oscuro' ? 'claro' : 'oscuro';
      try { localStorage.setItem(CLAVE, nuevo); } catch (e) {}
      aplicar(nuevo);
    };

    document.documentElement.setAttribute('data-tema', leer() || sistema());
    document.addEventListener('DOMContentLoaded', pintarBotones);

    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var alCambiar = function () { if (!leer()) aplicar(sistema()); };
      if (mq.addEventListener) mq.addEventListener('change', alCambiar);
    }
  })();
</script>
