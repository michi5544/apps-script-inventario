<style>
  :root {
    --color-base: #1C2B33;
    --color-base-suave: #44545C;
    --color-superficie: #F7F5F1;
    --color-superficie-card: #FFFFFF;
    --color-borde: #DDD8CE;
    --color-primario: #2D5F6B;
    --color-primario-oscuro: #21474F;
    --color-primario-claro: #E4EDEF;
    --color-secundario: #B8754F;
    --color-secundario-claro: #F3E6DC;
    --color-exito: #4A7C59;
    --color-exito-claro: #E6EFE8;
    --color-alerta: #C0392B;
    --color-alerta-claro: #F8E6E3;
    --radio-md: 8px;
    --radio-lg: 12px;
    --sombra-card: 0 1px 3px rgba(28, 43, 51, 0.08);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--color-superficie);
    color: var(--color-base);
    font-family: -apple-system, "Segoe UI", Inter, Roboto, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .contenedor {
    max-width: 720px;
    margin: 0 auto;
    padding: 24px 16px 64px;
  }

  .encabezado-app {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--color-primario);
    color: #FFFFFF;
    padding: 16px 20px;
    margin-bottom: 24px;
  }

  .encabezado-app h1 {
    font-size: 18px;
    font-weight: 600;
    margin: 0;
  }

  .encabezado-app .subtitulo {
    font-size: 13px;
    color: var(--color-primario-claro);
    margin: 2px 0 0;
  }

  .card {
    background: var(--color-superficie-card);
    border: 1px solid var(--color-borde);
    border-radius: var(--radio-lg);
    box-shadow: var(--sombra-card);
    padding: 20px;
    margin-bottom: 16px;
  }

  .card h2 {
    font-size: 16px;
    font-weight: 600;
    margin: 0 0 14px;
    color: var(--color-primario-oscuro);
  }

  label {
    display: block;
    font-size: 13px;
    font-weight: 600;
    color: var(--color-base-suave);
    margin-bottom: 6px;
  }

  .campo {
    margin-bottom: 16px;
  }

  input[type="text"],
  input[type="number"],
  input[type="email"],
  input[type="date"],
  select,
  textarea {
    width: 100%;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--color-borde);
    border-radius: var(--radio-md);
    background: var(--color-superficie-card);
    color: var(--color-base);
  }

  input:focus,
  select:focus,
  textarea:focus {
    outline: none;
    border-color: var(--color-primario);
    box-shadow: 0 0 0 3px var(--color-primario-claro);
  }

  .boton {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    width: 100%;
    padding: 12px 18px;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    border: none;
    border-radius: var(--radio-md);
    cursor: pointer;
    transition: filter 0.15s ease;
  }

  .boton:active { filter: brightness(0.92); }
  .boton:disabled { opacity: 0.55; cursor: not-allowed; }

  .boton-primario { background: var(--color-primario); color: #FFFFFF; }
  .boton-secundario { background: var(--color-secundario); color: #FFFFFF; }
  .boton-fantasma { background: transparent; color: var(--color-primario); border: 1px solid var(--color-primario); }

  .insignia {
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 10px;
    border-radius: 999px;
  }

  .insignia-exito { background: var(--color-exito-claro); color: var(--color-exito); }
  .insignia-alerta { background: var(--color-alerta-claro); color: var(--color-alerta); }
  .insignia-neutral { background: var(--color-primario-claro); color: var(--color-primario-oscuro); }

  .mensaje {
    padding: 12px 14px;
    border-radius: var(--radio-md);
    font-size: 14px;
    margin-bottom: 16px;
  }

  .mensaje-error { background: var(--color-alerta-claro); color: var(--color-alerta); border: 1px solid var(--color-alerta); }
  .mensaje-exito { background: var(--color-exito-claro); color: var(--color-exito); border: 1px solid var(--color-exito); }

  table {
    width: 100%;
    border-collapse: collapse;
    font-size: 14px;
  }

  table th {
    text-align: left;
    font-size: 12px;
    font-weight: 600;
    color: var(--color-base-suave);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    padding: 8px 10px;
    border-bottom: 2px solid var(--color-borde);
  }

  table td {
    padding: 10px;
    border-bottom: 1px solid var(--color-borde);
    font-variant-numeric: tabular-nums;
  }

  .opcion-rol {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 18px;
    border: 1px solid var(--color-borde);
    border-radius: var(--radio-lg);
    background: var(--color-superficie-card);
    cursor: pointer;
    margin-bottom: 12px;
    transition: border-color 0.15s ease;
  }

  .opcion-rol:hover { border-color: var(--color-primario); }

  .opcion-rol .icono {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: var(--color-primario-claro);
    color: var(--color-primario);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    font-weight: 700;
    flex-shrink: 0;
  }

  .opcion-rol .texto strong { display: block; font-size: 15px; }
  .opcion-rol .texto span { font-size: 13px; color: var(--color-base-suave); }

  .oculto { display: none !important; }

  @media (max-width: 480px) {
    .contenedor { padding: 16px 12px 48px; }
    .card { padding: 16px; }
  }
</style>
